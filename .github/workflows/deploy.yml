name: Deploy 9596 Nails to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: "9596-nails-–-luxury-nail-&-beauty-studio-berlin/package.json"

      - name: Install dependencies
        working-directory: "9596-nails-–-luxury-nail-&-beauty-studio-berlin"
        run: npm install

      - name: Build website
        working-directory: "9596-nails-–-luxury-nail-&-beauty-studio-berlin"
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: "9596-nails-–-luxury-nail-&-beauty-studio-berlin/dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
